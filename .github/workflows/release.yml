name: Release

# Build Etemenanki for Windows and Linux and publish binaries to a GitHub
# Release when a version tag (e.g. Version_1.5.0) is pushed, then open a PR to
# update the Knossos tool repo so the new version goes live.
on:
  push:
    tags:
      - 'Version_*'
  # Manual dry-run from the Actions tab: builds both OSes and uploads artifacts,
  # but only publishes a Release (and opens the Knossos PR) on a real tag.
  workflow_dispatch:

permissions:
  contents: write   # required to create the Release and upload assets

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qt_host: windows
            qt_arch: win64_msvc2022_64
          - os: ubuntu-latest
            qt_host: linux
            qt_arch: linux_gcc_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Etemenanki uses only base Qt modules (core/gui/widgets), so no extra
      # modules are installed — this matches the plugin set the app has shipped.
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true

      # ---- Windows -------------------------------------------------------
      - name: Configure & build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The Visual Studio generator finds MSVC itself (no dev-prompt needed)
          # and produces the same .slnx/.vcxproj a developer gets locally.
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build --config Release --parallel

      - name: Package with windeployqt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The Knossos entry expects the exe at "Release/Etemenanki.exe" inside
          # the zip, so stage into a Release\ folder and archive that folder.
          $name = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $staging = "dist\Release"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "build\Release\Etemenanki.exe" $staging
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release --no-translations --compiler-runtime `
            "$staging\Etemenanki.exe"
          Copy-Item "readme.md","LICENSE.md" $staging -ErrorAction SilentlyContinue
          $zip = "Etemenanki-$name-win64.zip"
          Compress-Archive -Path "dist\Release" -DestinationPath $zip -Force
          "ASSET=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Etemenanki-win64
          path: ${{ env.ASSET }}

      # ---- Linux ---------------------------------------------------------
      - name: Install Linux build & Qt xcb deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # ninja for the build; libgl + libxcb-* so the Qt 'xcb' platform
          # plugin (and its deps) exist for linuxdeploy to bundle.
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev libxkbcommon-dev \
            libxcb1-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-util1

      - name: Configure & build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build --parallel

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          name="${GITHUB_REF_NAME:-dev}"
          appdir="$PWD/AppDir"
          mkdir -p "$appdir/usr/bin" \
                   "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp build/Etemenanki "$appdir/usr/bin/Etemenanki"
          cp Etemenanki/icon.png "$appdir/usr/share/icons/hicolor/256x256/apps/Etemenanki.png"
          {
            echo "[Desktop Entry]"
            echo "Type=Application"
            echo "Name=Etemenanki"
            echo "Comment=A translation tool for FreeSpace Open"
            echo "Exec=Etemenanki"
            echo "Icon=Etemenanki"
            echo "Categories=Utility;Development;"
            echo "Terminal=false"
          } > "$appdir/usr/share/applications/Etemenanki.desktop"

          curl -fL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fL -o linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          # linuxdeploy finds its plugins next to itself / on PATH.
          export PATH="$PWD:$PATH"

          # Runners lack FUSE; run the AppImage tools by extracting instead.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          ./linuxdeploy --appdir "$appdir" --plugin qt --output appimage

          # Rename whatever AppImage was produced to the versioned asset name.
          built="$(ls -1 Etemenanki*.AppImage | head -n1)"
          final="Etemenanki-${name}-x86_64.AppImage"
          if [ "$built" != "$final" ]; then mv "$built" "$final"; fi
          echo "ASSET=$final" >> "$GITHUB_ENV"

      - name: Upload build artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Etemenanki-linux-appimage
          path: ${{ env.ASSET }}

  # Publish both OS assets to the Release, but only on a real tag.
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          draft: false
          prerelease: false
          generate_release_notes: true

  # Open a pull request against the Knossos tool repo to point it at the new
  # release (Windows zip only). Runs only on a real tag, after the Release is
  # published, and only if the KNOSSOS_PAT secret is configured.
  knossos-pr:
    name: Propose Knossos update
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check for token
        id: gate
        env:
          KNOSSOS_PAT: ${{ secrets.KNOSSOS_PAT }}
        run: |
          if [ -n "$KNOSSOS_PAT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KNOSSOS_PAT secret not set — skipping Knossos PR."
          fi

      - name: Checkout Knossos tool repo (upstream)
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: KnossosNET/Knet-Tool-Repo
          ref: main
          token: ${{ secrets.KNOSSOS_PAT }}
          path: knossos

      - name: Update knet_tools.json
        if: steps.gate.outputs.enabled == 'true'
        working-directory: knossos
        env:
          TAG: ${{ github.ref_name }}
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Etemenanki-${{ github.ref_name }}-win64.zip
        run: |
          set -euo pipefail
          # Version tags look like "Version_1.5.0"; Knossos wants "1.5.0".
          export VER="${TAG#Version_}"
          export DATE="$(date -u +%F)"
          # Surgical, minimal-diff edit: only the Etemenanki entry's version,
          # last_update and download_url change. We splice inside that one JSON
          # object's braces rather than re-serialize the whole file, so the rest
          # of knet_tools.json (which has inconsistent indentation) is untouched.
          python3 - "knet_tools.json" <<'PY'
          import io, os, re, json, sys
          path = sys.argv[1]
          ver  = os.environ["VER"]
          date = os.environ["DATE"]
          url  = os.environ["DOWNLOAD_URL"]

          s = io.open(path, encoding="utf-8").read()
          m = re.search(r'"name"\s*:\s*"Etemenanki"', s)
          if not m:
              sys.exit("Etemenanki entry not found")
          start = s.rfind("{", 0, m.start())
          depth, i, end = 0, start, None
          while i < len(s):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
              i += 1
          if end is None:
              sys.exit("could not find end of Etemenanki object")

          block = s[start:end]
          block = re.sub(r'("version"\s*:\s*)"[^"]*"',      r'\g<1>"%s"' % ver,  block, count=1)
          block = re.sub(r'("last_update"\s*:\s*)"[^"]*"',  r'\g<1>"%s"' % date, block, count=1)
          block = re.sub(r'("download_url"\s*:\s*)"[^"]*"', r'\g<1>"%s"' % url,  block, count=1)
          s2 = s[:start] + block + s[end:]

          data = json.loads(s2)  # fail loudly if we produced invalid JSON
          a = [e for e in data if e.get("name") == "Etemenanki"][0]
          assert a["version"] == ver, a["version"]
          assert a["last_update"] == date, a["last_update"]
          assert a["packages"][0]["download_url"] == url, a["packages"][0]["download_url"]

          io.open(path, "w", encoding="utf-8", newline="").write(s2)
          PY
          git --no-pager diff -- knet_tools.json

      - name: Create pull request
        if: steps.gate.outputs.enabled == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.KNOSSOS_PAT }}
          path: knossos
          push-to-fork: MjnMixael/Knet-Tool-Repo
          branch: etemenanki-${{ github.ref_name }}
          base: main
          commit-message: "Update Etemenanki to ${{ github.ref_name }}"
          title: "Update Etemenanki to ${{ github.ref_name }}"
          body: |
            Automated update of **Etemenanki** to `${{ github.ref_name }}`.

            - Release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

            Opened automatically by the Etemenanki release workflow.
          delete-branch: true
